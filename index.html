<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR金魚すくい</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { 
      margin: 0; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; 
      user-select: none; -webkit-user-select: none; touch-action: manipulation;
    }
    #ui-container { 
      position: absolute; top: 10px; left: 10px; right: 10px; 
      display: flex; justify-content: space-between; z-index: 10; 
      color: #fff; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); font-size: 18px; font-weight: bold; pointer-events: none; 
    }
    .ui-box { background: rgba(0, 0, 0, 0.5); padding: 8px 12px; border-radius: 8px; }
    
    /* ゲームオーバー＆ランキング画面 */
    #game-over { 
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0, 0, 0, 0.85); z-index: 20; 
      flex-direction: column; justify-content: flex-start; align-items: center; 
      color: white; overflow-y: auto; padding: 20px 10px; box-sizing: border-box;
    }
    #game-over h1 { font-size: 28px; margin: 10px 0; color: #ff4757; }
    #game-over p { font-size: 16px; margin: 4px 0; }
    
    .input-group { margin: 15px 0; text-align: center; }
    .input-group input { padding: 8px 12px; font-size: 16px; border-radius: 6px; border: none; text-align: center; }
    .btn { padding: 10px 20px; font-size: 16px; background: #2ed573; border: none; color: white; border-radius: 20px; cursor: pointer; margin-top: 5px; }
    
    /* ランキング表スタイル */
    #ranking-container { width: 100%; max-width: 360px; margin-top: 15px; display: none; }
    .ranking-section { background: rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    .ranking-title { font-size: 16px; font-weight: bold; color: #fbc531; margin-bottom: 5px; border-bottom: 1px solid #555; padding-bottom: 3px; }
    .ranking-list { font-size: 14px; text-align: left; line-height: 1.5; }
    .my-rank { color: #00d2d3; font-weight: bold; font-size: 15px; margin-bottom: 8px; text-align: center; }
  </style>
</head>
<body>

  <div id="ui-container">
    <div class="ui-box">掬った数: <span id="count-val">0</span> 匹</div>
    <div class="ui-box">得点: <span id="score-val">0</span> pt</div>
  </div>

  <!-- Game Over Screen -->
  <div id="game-over">
    <h1>ポイが破れました！</h1>
    <p>最終結果: <span id="final-count">0</span> 匹 / <span id="final-score">0</span> pt</p>
    
    <!-- 名前入力フォーム -->
    <div id="submit-form" class="input-group">
      <input type="text" id="player-name" placeholder="名前を入力" maxlength="10"><br><br>
      <button class="btn" onclick="submitScore()">スコアを登録して順位を見る</button>
    </div>

    <!-- ランキング表示エリア -->
    <div id="ranking-container">
      <div id="my-rank-display" class="my-rank"></div>

      <div class="ranking-section">
        <div class="ranking-title">🏆 掬った数 TOP3</div>
        <div id="top-count-list" class="ranking-list"></div>
      </div>

      <div class="ranking-section">
        <div class="ranking-title">⭐ 得点 TOP3</div>
        <div id="top-score-list" class="ranking-list"></div>
      </div>

      <button class="btn" style="background:#3742fa;" onclick="resetGame()">もう一度遊ぶ</button>
    </div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: yes;" 
    color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="fishModelA" src="./goldfish_crucian_carp.glb"></a-asset-item>
      <a-asset-item id="fishModelB" src="./goldfish.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="example-target" mindar-image-target="targetIndex: 0">
      <a-plane id="pond" position="0 0 0" rotation="0 0 0" width="1.2" height="1.2" material="opacity: 0; transparent: true"></a-plane>
      <a-entity id="fish-container"></a-entity>
      <a-entity id="effect-container"></a-entity>
    </a-entity>

    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="1 2 1" intensity="0.8"></a-light>
  </a-scene>

  <script>
    // ★ここをご自身のGASのデプロイWebアプリURLに書き換えてください★
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzpxrfqTYib4fPKU4naGKDna9FmZr2gbL3HeusESJjnsn2njilt7qNggID_I4Jeul9D/exec";

    // --- パラメータ（難易度調整版） ---
    const MAX_FISH = 8;
    const CATCH_RADIUS = 0.10; 
    const DURABILITY_DECREASE = 10; 
    const BOUNDS = 0.45;

    let score = 0;
    let caughtCount = 0;
    let durability = 100;
    let isGameOver = false;
    let fishes = [];

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    const SPEED_TYPES = {
      SLOW:   { type: 'SLOW',   speed: 0.003, score: 100 },
      NORMAL: { type: 'NORMAL', speed: 0.008, score: 300 },
      FAST:   { type: 'FAST',   speed: 0.015, score: 1000 }
    };

    const pond = document.getElementById('pond');
    const targetEntity = document.getElementById('example-target');
    const fishContainer = document.getElementById('fish-container');
    const effectContainer = document.getElementById('effect-container');

    window.addEventListener('load', () => {
      initGame();
      
      window.addEventListener('pointerdown', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
        if (isGameOver) return;

        if (!audioCtx) audioCtx = new AudioContext();
        if (!targetEntity.object3D.visible) return;

        handleScreenTap(e.clientX, e.clientY);
      });
    });

    function initGame() {
      score = 0;
      caughtCount = 0;
      durability = 100;
      isGameOver = false;

      updateUI();
      document.getElementById('game-over').style.display = 'none';
      document.getElementById('submit-form').style.display = 'block';
      document.getElementById('ranking-container').style.display = 'none';

      while (fishContainer.firstChild) fishContainer.removeChild(fishContainer.firstChild);
      fishes = [];

      for (let i = 0; i < MAX_FISH; i++) spawnFish();
    }

    function spawnFish() {
      if (fishes.length >= MAX_FISH) return;

      const fastCount = fishes.filter(f => f.type === 'FAST').length;
      let speedConfig = (fastCount >= 1) 
        ? (Math.random() < 0.5 ? SPEED_TYPES.SLOW : SPEED_TYPES.NORMAL)
        : (Math.random() < 0.4 ? SPEED_TYPES.SLOW : (Math.random() < 0.8 ? SPEED_TYPES.NORMAL : SPEED_TYPES.FAST));

      const moverEl = document.createElement('a-entity');
      const rotatorEl = document.createElement('a-entity');
      const modelEl = document.createElement('a-entity');
      
      if (speedConfig.type === 'FAST') {
        modelEl.setAttribute('gltf-model', '#fishModelA');
        modelEl.setAttribute('scale', '0.2 0.2 0.2');
      } else {
        modelEl.setAttribute('gltf-model', '#fishModelB');
        modelEl.setAttribute('scale', '0.001 0.001 0.001');
      }

      modelEl.setAttribute('rotation', '90 0 0');
      rotatorEl.appendChild(modelEl);
      moverEl.appendChild(rotatorEl);

      const x = (Math.random() - 0.5) * BOUNDS * 2;
      const y = (Math.random() - 0.5) * BOUNDS * 2;
      moverEl.setAttribute('position', `${x} ${y} 0.01`);

      fishContainer.appendChild(moverEl);

      fishes.push({
        type: speedConfig.type, mover: moverEl, rotator: rotatorEl,
        speed: speedConfig.speed, scoreValue: speedConfig.score,
        posX: x, posY: y,
        targetX: (Math.random() - 0.5) * BOUNDS * 2, targetY: (Math.random() - 0.5) * BOUNDS * 2
      });
    }

    function tick() {
      if (isGameOver || !targetEntity.object3D.visible) {
        requestAnimationFrame(tick);
        return;
      }

      fishes.forEach(fish => {
        const dx = fish.targetX - fish.posX;
        const dy = fish.targetY - fish.posY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 0.02) {
          fish.targetX = (Math.random() - 0.5) * BOUNDS * 2;
          fish.targetY = (Math.random() - 0.5) * BOUNDS * 2;
        } else {
          fish.posX += (dx / dist) * fish.speed;
          fish.posY += (dy / dist) * fish.speed;

          const angleDeg = Math.atan2(dx, dy) * (180 / Math.PI);
          fish.mover.setAttribute('position', `${fish.posX} ${fish.posY} 0.01`);
          fish.rotator.setAttribute('rotation', `0 0 ${-angleDeg + 180}`);
        }
      });

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    function handleScreenTap(clientX, clientY) {
      const sceneEl = document.querySelector('a-scene');
      const camera = sceneEl.camera;
      if (!camera) return;

      const mouse = new THREE.Vector2(
        (clientX / window.innerWidth) * 2 - 1,
        -(clientY / window.innerHeight) * 2 + 1
      );

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObject(pond.object3D, true);

      if (intersects.length > 0) {
        const worldPoint = intersects[0].point;
        const localPoint = targetEntity.object3D.worldToLocal(worldPoint.clone());
        const tapX = localPoint.x;
        const tapY = localPoint.y;

        let totalGainedScore = 0;
        let caughtInThisTap = 0;

        createRippleEffect(tapX, tapY);

        for (let i = fishes.length - 1; i >= 0; i--) {
          const fish = fishes[i];
          const dist = Math.sqrt(Math.pow(fish.posX - tapX, 2) + Math.pow(fish.posY - tapY, 2));

          if (dist <= CATCH_RADIUS) {
            score += fish.scoreValue;
            totalGainedScore += fish.scoreValue;
            caughtCount++;
            caughtInThisTap++;

            fish.mover.remove();
            fishes.splice(i, 1);
            spawnFish();
          }
        }

        if (caughtInThisTap > 0) {
          playSplashSound();
          createScorePopup(tapX, tapY, `+${totalGainedScore}pt`);
        }
      }

      durability -= DURABILITY_DECREASE;
      if (durability <= 0) {
        durability = 0;
        updateUI();
        endGame();
        return;
      }

      updateUI();
    }

    function playSplashSound() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.15);

      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function createRippleEffect(x, y) {
      const ring = document.createElement('a-ring');
      ring.setAttribute('position', `${x} ${y} 0.02`);
      ring.setAttribute('radius-inner', '0.01');
      ring.setAttribute('radius-outer', '0.03');
      ring.setAttribute('material', 'color: #718093; opacity: 0.8; transparent: true');
      ring.setAttribute('animation__scale', { property: 'scale', to: '3 3 3', dur: 500, easing: 'easeOutQuad' });
      ring.setAttribute('animation__fade', { property: 'material.opacity', to: '0', dur: 500, easing: 'easeOutQuad' });
      effectContainer.appendChild(ring);
      setTimeout(() => { ring.remove(); }, 500);
    }

    function createScorePopup(x, y, text) {
      const textEl = document.createElement('a-text');
      textEl.setAttribute('value', text);
      textEl.setAttribute('position', `${x} ${y} 0.1`);
      textEl.setAttribute('align', 'center');
      textEl.setAttribute('color', '#fbc531');
      textEl.setAttribute('scale', '0.4 0.4 0.4');
      textEl.setAttribute('animation__move', { property: 'position', to: `${x} ${y + 0.15} 0.2`, dur: 800, easing: 'easeOutCubic' });
      textEl.setAttribute('animation__fade', { property: 'material.opacity', to: '0', dur: 800, easing: 'easeInCubic' });
      effectContainer.appendChild(textEl);
      setTimeout(() => { textEl.remove(); }, 800);
    }

    function updateUI() {
      document.getElementById('count-val').innerText = caughtCount;
      document.getElementById('score-val').innerText = score;
    }

    function endGame() {
      isGameOver = true;
      document.getElementById('final-count').innerText = caughtCount;
      document.getElementById('final-score').innerText = score;
      document.getElementById('game-over').style.display = 'flex';
    }

    // --- スコア送信とランキング表示 ---
    async function submitScore() {
      const nameInput = document.getElementById('player-name').value.trim() || "名無し";
      
      document.getElementById('submit-form').style.display = 'none';

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            name: nameInput,
            count: caughtCount,
            score: score
          })
        });

        const data = await response.json();

        // 自分の順位表示
        document.getElementById('my-rank-display').innerHTML = 
          `あなたの順位<br>すくった数: <b>${data.myRank.countRank}</b> 位 / 得点: <b>${data.myRank.scoreRank}</b> 位`;

        // 掬った数 TOP3の表示
        let countHtml = "";
        data.topCount.forEach((item, index) => {
          countHtml += `${index + 1}位: ${item.name} - ${item.count}匹 (${item.score}pt)<br>`;
        });
        document.getElementById('top-count-list').innerHTML = countHtml;

        // 得点 TOP3の表示
        let scoreHtml = "";
        data.topScore.forEach((item, index) => {
          scoreHtml += `${index + 1}位: ${item.name} - ${item.score}pt (${item.count}匹)<br>`;
        });
        document.getElementById('top-score-list').innerHTML = scoreHtml;

        document.getElementById('ranking-container').style.display = 'block';

      } catch (err) {
        alert("ランキングの送信に失敗しました。");
        document.getElementById('submit-form').style.display = 'block';
      }
    }

    function resetGame() {
      initGame();
    }
  </script>
</body>
</html>
