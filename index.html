<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR金魚すくい</title>
  
  <!-- A-Frame & MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      user-select: none;
    }

    /* UIオーバーレイ */
    #ui-container {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
      pointer-events: none;
    }

    .ui-card {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      backdrop-filter: blur(4px);
    }

    .durability-bar {
      color: #ff4757;
    }

    /* ゲームオーバー画面 */
    #game-over {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 20;
      color: white;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #game-over h1 {
      font-size: 36px;
      margin-bottom: 10px;
      color: #ff4757;
    }

    #game-over p {
      font-size: 20px;
      margin: 5px 0;
    }

    #restart-btn {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      background-color: #2ed573;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <!-- スコア・耐久度表示 UI -->
  <div id="ui-container">
    <div class="ui-card">
      <div>ポイ耐久度: <span id="durability" class="durability-bar">10</span></div>
    </div>
    <div class="ui-card">
      <div>すくった数: <span id="caught-count">0</span> 匹</div>
      <div>得点: <span id="score">0</span> pt</div>
    </div>
  </div>

  <!-- ゲームオーバー画面 -->
  <div id="game-over">
    <h1>ポイが破れた！</h1>
    <p>最終すくい数: <span id="final-count">0</span> 匹</p>
    <p>最終得点: <span id="final-score">0</span> pt</p>
    <button id="restart-btn" onclick="resetGame()">もう一度あそぶ</button>
  </div>

  <!-- A-Frame / MindAR シーン -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="fishCarpModel" src="./goldfish_crucian_carp.glb"></a-asset-item>
      <a-asset-item id="fishGoldModel" src="./goldfish.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .clickable" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <!-- マーカーターゲット (上から見下ろす平面想定) -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- 金魚が泳ぐ水槽領域 (マーカー基準) -->
      <a-entity id="pond"></a-entity>

      <!-- タップ判定用の透明プレーン (ポイを沈めてすくう領域) -->
      <a-plane id="scoop-plane" class="clickable" position="0 0 0" rotation="0 0 0" width="3" height="3" material="transparent: true; opacity: 0.0"></a-plane>

    </a-entity>
  </a-scene>

  <script>
    // --- ゲーム設定項目 ---
    const MAX_FISH = 8;
    const INITIAL_DURABILITY = 10;
    const SCOOP_RADIUS = 0.45; // 1回のタップで掬える半径 (マーカー単位)
    const POND_LIMIT = 1.0;    // 水槽の移動境界範囲 (±X, ±Y)

    // 金魚の速度タイプ定義 (遅い / 普通 / 速い)
    const SPEED_TYPES = [
      { name: 'slow', speed: 0.003, score: 10, prob: 0.4 },
      { name: 'normal', speed: 0.007, score: 25, prob: 0.4 },
      { name: 'fast', speed: 0.012, score: 50, prob: 0.2 }
    ];

    // モデル設定
    const MODEL_CONFIGS = [
      { assetId: '#fishCarpModel', scale: '0.2 0.2 0.2' },
      { assetId: '#fishGoldModel', scale: '0.001 0.001 0.001' }
    ];

    // ゲーム状態変数
    let fishes = [];
    let score = 0;
    let caughtCount = 0;
    let durability = INITIAL_DURABILITY;
    let isGameOver = false;

    const pondEl = document.getElementById('pond');
    const durabilityEl = document.getElementById('durability');
    const scoreEl = document.getElementById('score');
    const caughtCountEl = document.getElementById('caught-count');
    const gameOverEl = document.getElementById('game-over');

    // ランダムな速度タイプを取得
    function getRandomSpeedType() {
      const rand = Math.random();
      let cumulative = 0;
      for (const type of SPEED_TYPES) {
        cumulative += type.prob;
        if (rand < cumulative) return type;
      }
      return SPEED_TYPES[0];
    }

    // 単一の金魚を生成
    function createFish(id) {
      const config = MODEL_CONFIGS[Math.floor(Math.random() * MODEL_CONFIGS.length)];
      const speedType = getRandomSpeedType();

      const el = document.createElement('a-entity');
      el.setAttribute('gltf-model', config.assetId);
      el.setAttribute('scale', config.scale);
      
      // 平面上を泳ぐため、Z座標は若干浮かせる(0.02)
      const posX = (Math.random() - 0.5) * POND_LIMIT * 1.5;
      const posY = (Math.random() - 0.5) * POND_LIMIT * 1.5;
      el.setAttribute('position', `${posX} ${posY} 0.02`);

      pondEl.appendChild(el);

      // ランダムな移動方向ベクトル
      const angle = Math.random() * Math.PI * 2;
      const dirX = Math.cos(angle);
      const dirY = Math.sin(angle);

      return {
        id,
        el,
        x: posX,
        y: posY,
        dirX,
        dirY,
        speed: speedType.speed,
        scoreValue: speedType.score,
        active: true
      };
    }

    // 初期化・スポーン
    function initFish() {
      pondEl.innerHTML = '';
      fishes = [];
      for (let i = 0; i < MAX_FISH; i++) {
        fishes.push(createFish(i));
      }
    }

    // 金魚の位置と向きの更新フレーム処理
    function updateFish() {
      if (isGameOver) return;

      fishes.forEach(fish => {
        if (!fish.active) return;

        // 次の位置計算
        let newX = fish.x + fish.dirX * fish.speed;
        let newY = fish.y + fish.dirY * fish.speed;

        // 壁でのバウンド判定
        if (Math.abs(newX) > POND_LIMIT) {
          fish.dirX *= -1;
          newX = fish.x + fish.dirX * fish.speed;
        }
        if (Math.abs(newY) > POND_LIMIT) {
          fish.dirY *= -1;
          newY = fish.y + fish.dirY * fish.speed;
        }

        // 定期的にランダムで泳ぐ方向を少し変更する
        if (Math.random() < 0.02) {
          const changeAngle = (Math.random() - 0.5) * 0.8;
          const currentAngle = Math.atan2(fish.dirY, fish.dirX) + changeAngle;
          fish.dirX = Math.cos(currentAngle);
          fish.dirY = Math.sin(currentAngle);
        }

        fish.x = newX;
        fish.y = newY;

        // 進行方向への向き設定 (A-FrameのRotation変換)
        // 進行方向の角度( radian -> degree )
        const headingDeg = Math.atan2(fish.dirY, fish.dirX) * (180 / Math.PI);
        
        // 金魚モデルの初期向きに合わせた回転補正 (Z軸回転)
        elPosition = `${fish.x} ${fish.y} 0.02`;
        fish.el.setAttribute('position', elPosition);
        fish.el.setAttribute('rotation', `90 ${headingDeg - 90} 0`);
      });

      requestAnimationFrame(updateFish);
    }

    // 水面タップ時の「ポイですくう」処理
    document.addEventListener('DOMContentLoaded', () => {
      const scoopPlane = document.getElementById('scoop-plane');

      scoopPlane.addEventListener('click', (evt) => {
        if (isGameOver) return;

        // 耐久度の減少
        durability--;
        durabilityEl.innerText = durability;

        // タップ位置の交点座標 (マーカーローカル系)
        const intersection = evt.detail.intersection;
        if (intersection) {
          const tapPoint = intersection.point;
          
          let caughtThisTurn = 0;

          fishes.forEach((fish, index) => {
            if (!fish.active) return;

            // タップ位置と金魚の距離計算
            const dx = fish.x - tapPoint.x;
            const dy = fish.y - tapPoint.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            // 範囲内の金魚を一括で獲得
            if (dist <= SCOOP_RADIUS) {
              fish.active = false;
              score += fish.scoreValue;
              caughtCount++;
              caughtThisTurn++;

              // 旧モデル削除 & 新しい金魚の再スポーン
              pondEl.removeChild(fish.el);
              setTimeout(() => {
                if (!isGameOver) {
                  fishes[index] = createFish(index);
                }
              }, 600);
            }
          });

          // UIの更新
          scoreEl.innerText = score;
          caughtCountEl.innerText = caughtCount;
        }

        // ゲーム終了判定
        if (durability <= 0) {
          triggerGameOver();
        }
      });
    });

    // ゲームオーバー処理
    function triggerGameOver() {
      isGameOver = true;
      document.getElementById('final-count').innerText = caughtCount;
      document.getElementById('final-score').innerText = score;
      gameOverEl.style.display = 'flex';
    }

    // リセット処理
    function resetGame() {
      score = 0;
      caughtCount = 0;
      durability = INITIAL_DURABILITY;
      isGameOver = false;

      scoreEl.innerText = score;
      caughtCountEl.innerText = caughtCount;
      durabilityEl.innerText = durability;
      gameOverEl.style.display = 'none';

      initFish();
      requestAnimationFrame(updateFish);
    }

    // 初期化開始
    window.addEventListener('load', () => {
      initFish();
      requestAnimationFrame(updateFish);
    });
  </script>
</body>
</html>
