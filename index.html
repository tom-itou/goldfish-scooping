<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR金魚すくい</title>
  <!-- A-Frame & MindAR Libraries -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      user-select: none;
    }
    #ui-container {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      font-size: 18px;
      font-weight: bold;
      pointer-events: none;
    }
    .ui-box {
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 12px;
      border-radius: 8px;
    }
    #game-over {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 20;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
    }
    #game-over h1 { font-size: 36px; margin-bottom: 10px; color: #ff4757; }
    #game-over p { font-size: 20px; margin: 5px 0; }
    #restart-btn {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 18px;
      background: #2ed573;
      border: none;
      color: white;
      border-radius: 25px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- UI Overlay -->
  <div id="ui-container">
    <div class="ui-box">掬った数: <span id="count-val">0</span> 匹</div>
    <div class="ui-box">得点: <span id="score-val">0</span> pt</div>
    <div class="ui-box">ポイ耐久度: <span id="durability-val">100</span>%</div>
  </div>

  <!-- Game Over Screen -->
  <div id="game-over">
    <h1>ポイが破れました！</h1>
    <p>最終結果: <span id="final-count">0</span> 匹</p>
    <p>最終得点: <span id="final-score">0</span> pt</p>
    <button id="restart-btn" onclick="resetGame()">もう一度遊ぶ</button>
  </div>

  <!-- AR Scene -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="fishModelA" src="./goldfish_crucian_carp.glb"></a-asset-item>
      <a-asset-item id="fishModelB" src="./goldfish.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <!-- AR Target Container -->
    <a-entity id="example-target" mindar-image-target="targetIndex: 0">
      <!-- 金魚が泳ぐエリア（平面上の基準） -->
      <a-entity id="pond" position="0 0 0"></a-entity>
    </a-entity>

    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="1 2 1" intensity="0.8"></a-light>
  </a-scene>

  <script>
    // --- ゲーム設定と状態 ---
    const MAX_FISH = 8;
    const CATCH_RADIUS = 0.35; // 1回のタップで掬える範囲（AR座標空間内の距離）
    const DURABILITY_DECREASE = 10; // 1タップあたりの耐久度減少値
    const BOUNDS = 0.8; // マーカー上での金魚の行動範囲（-0.8 〜 0.8）

    let score = 0;
    let caughtCount = 0;
    let durability = 100;
    let isGameOver = false;
    let fishes = [];

    // 速度タイプ定義
    const SPEED_TYPES = {
      SLOW:   { speed: 0.003, score: 100, label: '遅い' },
      NORMAL: { speed: 0.007, score: 300, label: '普通' },
      FAST:   { speed: 0.012, score: 500, label: '速い' }
    };

    const pond = document.getElementById('pond');

    // --- 初期化 ---
    window.addEventListener('load', () => {
      initGame();
      
      // 画面全体タップ（ポイで掬う動作）
      window.addEventListener('click', (e) => {
        if (isGameOver) return;
        
        // UIタップ時は無効化
        if (e.target.tagName === 'BUTTON') return;

        handleScoop(e);
      });
    });

    function initGame() {
      score = 0;
      caughtCount = 0;
      durability = 100;
      isGameOver = false;
      
      updateUI();
      document.getElementById('game-over').style.display = 'none';

      // 既存の金魚を削除
      fishes.forEach(f => f.element.remove());
      fishes = [];

      // 初期の金魚を生成
      for (let i = 0; i < MAX_FISH; i++) {
        spawnFish();
      }
    }

    // --- 金魚の生成 ---
    function spawnFish() {
      if (fishes.length >= MAX_FISH) return;

      const el = document.createElement('a-entity');
      
      // 2種類のモデルをランダムに割り当て
      const isTypeA = Math.random() < 0.5;
      if (isTypeA) {
        el.setAttribute('gltf-model', '#fishModelA');
        el.setAttribute('scale', '0.2 0.2 0.2');
      } else {
        el.setAttribute('gltf-model', '#fishModelB');
        el.setAttribute('scale', '0.001 0.001 0.001');
      }

      // 速度タイプの決定 (遅い:40%, 普通:40%, 速い:20%)
      const rand = Math.random();
      let speedConfig;
      if (rand < 0.4) speedConfig = SPEED_TYPES.SLOW;
      else if (rand < 0.8) speedConfig = SPEED_TYPES.NORMAL;
      else speedConfig = SPEED_TYPES.FAST;

      // 初期位置・目標位置の設定（平面Z=0上に配置）
      const x = (Math.random() - 0.5) * BOUNDS * 2;
      const y = (Math.random() - 0.5) * BOUNDS * 2;
      el.setAttribute('position', `${x} ${y} 0`);

      pond.appendChild(el);

      const fishData = {
        element: el,
        speed: speedConfig.speed,
        scoreValue: speedConfig.score,
        posX: x,
        posY: y,
        targetX: (Math.random() - 0.5) * BOUNDS * 2,
        targetY: (Math.random() - 0.5) * BOUNDS * 2
      };

      fishes.push(fishData);
    }

    // --- メインループ（移動と回転制御） ---
    function tick() {
      if (isGameOver) return;

      fishes.forEach(fish => {
        // 目標地点へのベクトル計算
        const dx = fish.targetX - fish.posX;
        const dy = fish.targetY - fish.posY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        // 目標地点に近づいたら新しい目標を設定
        if (dist < 0.05) {
          fish.targetX = (Math.random() - 0.5) * BOUNDS * 2;
          fish.targetY = (Math.random() - 0.5) * BOUNDS * 2;
        } else {
          // 移動
          fish.posX += (dx / dist) * fish.speed;
          fish.posY += (dy / dist) * fish.speed;

          // 金魚の向きを移動方向へ合わせる (ラジアン -> 度)
          const angleRad = Math.atan2(dy, dx);
          const angleDeg = angleRad * (180 / Math.PI);

          fish.element.setAttribute('position', `${fish.posX} ${fish.posY} 0`);
          // マーカーを上から見下ろす前提のため、Z軸回転で進行方向を制御
          fish.element.setAttribute('rotation', `0 0 ${angleDeg - 90}`);
        }
      });

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // --- タップ（掬う）処理 ---
    function handleScoop(event) {
      // ポイの耐久度減少
      durability -= DURABILITY_DECREASE;
      if (durability <= 0) {
        durability = 0;
        endGame();
      }
      updateUI();

      // レイキャストでタップ位置の3D空間座標を取得
      const cameraEl = document.querySelector('a-camera');
      const raycaster = cameraEl.components.raycaster;
      const intersects = raycaster.getIntersection(pond);

      // マーカー平面上またはカメラ中央付近を基準として距離判定
      let tapX = 0, tapY = 0;
      if (intersects) {
        const localPoint = pond.object3D.worldToLocal(intersects.point.clone());
        tapX = localPoint.x;
        tapY = localPoint.y;
      }

      // 範囲内の金魚を一括で掬う
      let caughtInThisTap = 0;
      for (let i = fishes.length - 1; i >= 0; i--) {
        const fish = fishes[i];
        const dist = Math.sqrt(Math.pow(fish.posX - tapX, 2) + Math.pow(fish.posY - tapY, 2));

        if (dist <= CATCH_RADIUS) {
          // 掬う成功
          score += fish.scoreValue;
          caughtCount++;
          caughtInThisTap++;

          // 画面から削除
          fish.element.remove();
          fishes.splice(i, 1);

          // 補充
          spawnFish();
        }
      }

      updateUI();
    }

    // --- UI更新 & ゲームオーバー ---
    function updateUI() {
      document.getElementById('count-val').innerText = caughtCount;
      document.getElementById('score-val').innerText = score;
      document.getElementById('durability-val').innerText = durability;
    }

    function endGame() {
      isGameOver = true;
      document.getElementById('final-count').innerText = caughtCount;
      document.getElementById('final-score').innerText = score;
      document.getElementById('game-over').style.display = 'flex';
    }

    function resetGame() {
      initGame();
    }
  </script>
</body>
</html>
