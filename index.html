<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR金魚すくい - 三丁目ふれあいひろば</title>
    <!-- A-Frame, MindAR, animation-mixerライブラリ -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <style>
      #ui-container {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 999;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        color: white;
        background: rgba(0, 0, 0, 0.65);
        padding: 15px 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
      .ui-text {
        font-size: 18px;
        font-weight: bold;
        margin: 5px 0;
      }
      #game-over-modal {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        z-index: 1000;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: sans-serif;
      }
      #game-over-modal h1 {
        font-size: 36px;
        color: #ff4757;
        margin-bottom: 10px;
      }
      #game-over-modal p {
        font-size: 22px;
        margin: 8px 0;
      }
      #retry-btn {
        font-size: 20px;
        padding: 12px 30px;
        margin-top: 20px;
        background: #2ed573;
        color: white;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-weight: bold;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- UI（耐久度・すくった数・スコア） -->
    <div id="ui-container">
      <div class="ui-text">ポイの耐久度: <span id="durability-ui" style="color: #ff6b6b;">100</span> %</div>
      <div class="ui-text">すくった数: <span id="count-ui" style="color: #1e90ff;">0</span> 匹</div>
      <div class="ui-text">得点: <span id="score-ui" style="color: #ffd700;">0</span> 点</div>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="game-over-modal">
      <h1>ポイが破れた！</h1>
      <p>すくった数: <span id="final-count">0</span> 匹</p>
      <p>最終得点: <span id="final-score" style="color: #ffd700;">0</span> 点</p>
      <button id="retry-btn" onclick="resetGame()">もう一度あそぶ</button>
    </div>

    <!-- ARシーン設定 -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <!-- 3Dモデルアセット -->
      <a-assets>
        <a-asset-item id="fish-model-1" src="./goldfish_crucian_carp.glb"></a-asset-item>
        <a-asset-item id="fish-model-2" src="./goldfish.glb"></a-asset-item>
      </a-assets>

      <!-- カメラとレイキャスト設定 -->
      <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .clickable" cursor="rayOrigin: mouse"></a-camera>

      <!-- マーカー認識範囲 -->
      <a-entity id="target-container" mindar-image-target="targetIndex: 0">
        <a-plane id="water-surface" class="clickable" position="0 0 0" width="1" height="1" visible="false"></a-plane>
      </a-entity>
    </a-scene>

    <script>
      // 定数設定
      const MAX_FISH_COUNT = 10;     // 最大金魚数
      const INITIAL_DURABILITY = 100;// 初期耐久度
      const DURABILITY_COST = 10;   // 1タップごとの消費耐久度
      const CATCH_RADIUS = 0.25;    // ポイですくえる範囲
      const MODELS = ['#fish-model-1', '#fish-model-2'];
      const SCALES = ['0.2 0.2 0.2', '0.001 0.001 0.001'];

      // 速度・点数の3段階定義
      const SPEED_TYPES = [
        { type: 'slow',   speedFactor: 0.5, score: 10, prob: 0.4 },
        { type: 'normal', speedFactor: 1.0, score: 30, prob: 0.4 },
        { type: 'fast',   speedFactor: 2.2, score: 50, prob: 0.2 }
      ];

      // ゲーム状態変数
      let totalCount = 0;
      let totalScore = 0;
      let durability = INITIAL_DURABILITY;
      let isGameOver = false;

      // DOM要素
      const targetContainer = document.getElementById('target-container');
      const countUi = document.getElementById('count-ui');
      const scoreUi = document.getElementById('score-ui');
      const durabilityUi = document.getElementById('durability-ui');
      const gameOverModal = document.getElementById('game-over-modal');
      const finalCount = document.getElementById('final-count');
      const finalScore = document.getElementById('final-score');

      // タップ時の一括掬い処理
      document.querySelector('a-scene').addEventListener('click', (e) => {
        if (isGameOver) return;

        consumeDurability();

        const intersection = e.detail.intersection;
        if (!intersection) return;

        const clickPos = intersection.point;

        const allFish = document.querySelectorAll('.goldfish-entity');
        let caughtCount = 0;

        allFish.forEach(fish => {
          const fishWorldPos = new THREE.Vector3();
          fish.object3D.getWorldPosition(fishWorldPos);

          const distance = clickPos.distanceTo(fishWorldPos);

          if (distance <= CATCH_RADIUS) {
            const fishScore = parseInt(fish.getAttribute('data-score'), 10);
            
            totalCount++;
            totalScore += fishScore;
            caughtCount++;

            fish.parentNode.removeChild(fish);
          }
        });

        if (caughtCount > 0) {
          countUi.textContent = totalCount;
          scoreUi.textContent = totalScore;

          for (let i = 0; i < caughtCount; i++) {
            spawnFish();
          }
        }
      });

      // 耐久度減算
      function consumeDurability() {
        if (isGameOver) return;
        
        durability -= DURABILITY_COST;
        if (durability < 0) durability = 0;
        durabilityUi.textContent = durability;

        if (durability <= 0) {
          endGame();
        }
      }

      // ランダム座標生成
      function getRandomPosition() {
        return {
          x: (Math.random() - 0.5) * 0.6,
          y: (Math.random() - 0.5) * 0.1,
          z: (Math.random() - 0.5) * 0.8
        };
      }

      // 速度タイプ選定
      function getRandomSpeedType() {
        const rand = Math.random();
        let cumulative = 0;
        for (const speedObj of SPEED_TYPES) {
          cumulative += speedObj.prob;
          if (rand <= cumulative) return speedObj;
        }
        return SPEED_TYPES[0];
      }

      // 金魚の周遊（回転＋移動）
      function animateFish(fishEntity, speedFactor) {
        if (isGameOver || !fishEntity.parentElement) return;

        const currentPos = fishEntity.getAttribute('position') || { x: 0, y: 0, z: 0 };
        const nextPos = getRandomPosition();

        const dx = nextPos.x - currentPos.x;
        const dz = nextPos.z - currentPos.z;

        // 進行方向の角度を計算
        let angleY = Math.atan2(dx, dz) * (180 / Math.PI);

        const duration = (Math.random() * 2500 + 1500) / speedFactor;

        // 向きを変更
        fishEntity.setAttribute('animation__rotate', {
          property: 'rotation',
          to: `0 ${angleY} 0`,
          dur: 300,
          easing: 'easeOutQuad'
        });

        // 位置を移動
        fishEntity.setAttribute('animation__move', {
          property: 'position',
          to: `${nextPos.x} ${nextPos.y} ${nextPos.z}`,
          dur: duration,
          easing: 'easeInOutQuad'
        });

        fishEntity.addEventListener('animationcomplete__move', function onAnimComplete() {
          fishEntity.removeEventListener('animationcomplete__move', onAnimComplete);
          animateFish(fishEntity, speedFactor);
        });
      }

      // 金魚生成
      function spawnFish() {
        if (isGameOver) return;

        const fish = document.createElement('a-entity');
        const no = Math.floor(Math.random() * MODELS.length);
        const randomModel = MODELS[no];
        const initialPos = getRandomPosition();
        const speedConfig = getRandomSpeedType();

        fish.setAttribute('gltf-model', randomModel);
        fish.setAttribute('class', 'clickable goldfish-entity');
        fish.setAttribute('position', `${initialPos.x} ${initialPos.y} ${initialPos.z}`);
        fish.setAttribute('scale', SCALES[no]);
        fish.setAttribute('data-score', speedConfig.score);
        
        fish.setAttribute('animation-mixer', `timeScale: ${speedConfig.speedFactor}`);

        targetContainer.appendChild(fish);
        animateFish(fish, speedConfig.speedFactor);
      }

      // 初期化
      function initGame() {
        totalCount = 0;
        totalScore = 0;
        durability = INITIAL_DURABILITY;
        isGameOver = false;

        countUi.textContent = totalCount;
        scoreUi.textContent = totalScore;
        durabilityUi.textContent = durability;
        gameOverModal.style.display = 'none';

        const existingFish = document.querySelectorAll('.goldfish-entity');
        existingFish.forEach(fish => fish.parentNode.removeChild(fish));

        for (let i = 0; i < MAX_FISH_COUNT; i++) {
          spawnFish();
        }
      }

      // ゲームオーバー
      function endGame() {
        isGameOver = true;
        finalCount.textContent = totalCount;
        finalScore.textContent = totalScore;
        gameOverModal.style.display = 'flex';
      }

      // リトライ
      function resetGame() {
        initGame();
      }

      // 開始
      window.addEventListener('load', () => {
        setTimeout(initGame, 1000);
      });
    </script>
  </body>
</html>
