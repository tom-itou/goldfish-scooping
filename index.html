<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR金魚すくい（表示修正版）</title>
  <!-- A-Frame & MindAR Libraries -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; user-select: none; }
    #ui-container { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 10; color: #fff; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); font-size: 18px; font-weight: bold; pointer-events: none; }
    .ui-box { background: rgba(0, 0, 0, 0.5); padding: 8px 12px; border-radius: 8px; }
    #game-over { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); z-index: 20; flex-direction: column; justify-content: center; align-items: center; color: white; }
    #game-over h1 { font-size: 36px; margin-bottom: 10px; color: #ff4757; }
    #game-over p { font-size: 20px; margin: 5px 0; }
    #restart-btn { margin-top: 20px; padding: 12px 24px; font-size: 18px; background: #2ed573; border: none; color: white; border-radius: 25px; cursor: pointer; pointer-events: auto; }
  </style>
</head>
<body>

  <!-- UI Overlay -->
  <div id="ui-container">
    <div class="ui-box">掬った数: <span id="count-val">0</span> 匹</div>
    <div class="ui-box">得点: <span id="score-val">0</span> pt</div>
    <div class="ui-box">ポイ耐久度: <span id="durability-val">100</span>%</div>
  </div>

  <!-- Game Over Screen -->
  <div id="game-over">
    <h1>ポイが破れました！</h1>
    <p>最終結果: <span id="final-count">0</span> 匹</p>
    <p>最終得点: <span id="final-score">0</span> pt</p>
    <button id="restart-btn" onclick="resetGame()">もう一度遊ぶ</button>
  </div>

  <!-- AR Scene -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="fishModelA" src="./goldfish_crucian_carp.glb"></a-asset-item>
      <a-asset-item id="fishModelB" src="./goldfish.glb"></a-asset-item>
    </a-assets>

    <!-- レイキャスターの設定 -->
    <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .clickable" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <!-- AR Target Container -->
    <a-entity id="example-target" mindar-image-target="targetIndex: 0">
      <!-- 
        【修正ポイント1】判定用の透明な平面。
        MindARではデフォルトで手前（Z軸正）を向くため、rotationは0 0 0でOK。
        width/heightはターゲットの物理サイズに合わせて調整してください（ここでは仮に1とする）。
      -->
      <a-plane id="pond" class="clickable" position="0 0 0" rotation="0 0 0" width="1" height="1" material="opacity: 0; transparent: true"></a-plane>
      
      <!-- 金魚を保持するコンテナ -->
      <a-entity id="fish-container"></a-entity>
    </a-entity>

    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="1 2 1" intensity="0.8"></a-light>
  </a-scene>

  <script>
    // --- ゲーム設定と状態 ---
    const MAX_FISH = 8;
    const CATCH_RADIUS = 0.2; // マーカーサイズ（1とする）に対する掬える範囲
    const DURABILITY_DECREASE = 10;
    // 【修正ポイント2】行動範囲。ターゲットエンティティのサイズ（0.5 = ターゲットの端）に合わせる
    const BOUNDS = 0.45; 

    let score = 0;
    let caughtCount = 0;
    let durability = 100;
    let isGameOver = false;
    let fishes = [];

    const SPEED_TYPES = {
      SLOW:   { speed: 0.002, score: 100 }, // サイズ感に合わせて少し遅く設定
      NORMAL: { speed: 0.005, score: 300 },
      FAST:   { speed: 0.009, score: 500 }
    };

    const pond = document.getElementById('pond');
    const targetEntity = document.getElementById('example-target');
    const fishContainer = document.getElementById('fish-container');

    // --- 初期化 ---
    window.addEventListener('load', () => {
      initGame();
      
      // A-Frameのraycaster経由でクリックを取得
      pond.addEventListener('click', (e) => {
        if (isGameOver || !targetEntity.object3D.visible) return;
        handleScoop(e);
      });
    });

    function initGame() {
      score = 0;
      caughtCount = 0;
      durability = 100;
      isGameOver = false;
      
      updateUI();
      document.getElementById('game-over').style.display = 'none';

      // 既存の金魚を削除
      while (fishContainer.firstChild) {
        fishContainer.removeChild(fishContainer.firstChild);
      }
      fishes = [];

      // 初期の金魚を生成
      for (let i = 0; i < MAX_FISH; i++) {
        spawnFish();
      }
    }

    // --- 金魚の生成 ---
    function spawnFish() {
      if (fishes.length >= MAX_FISH) return;

      // 移動(位置)を制御する親エンティティ
      const moverEl = document.createElement('a-entity');
      
      // 向き(進行方向回転)を制御する中間のエンティティ
      const rotatorEl = document.createElement('a-entity');

      // モデル自体を持ち、初期の向きを修正する子エンティティ
      const modelEl = document.createElement('a-entity');
      
      const isTypeA = Math.random() < 0.5;
      if (isTypeA) {
        modelEl.setAttribute('gltf-model', '#fishModelA');
        modelEl.setAttribute('scale', '0.2 0.2 0.2');
      } else {
        modelEl.setAttribute('gltf-model', '#fishModelB');
        modelEl.setAttribute('scale', '0.001 0.001 0.001');
      }

      // 【修正ポイント3】初期の向き修正（入れ子構造の最下層）
      // モデルがカメラ（Z負）を向いている場合、マーカー平面（XY）に寝かせ、
      // かつ回転の基準（0度）が上（Y正）を向くように調整する。
      // glbモデルの初期向き依存だが、一般的な「X+90, Y=0, Z=0」で寝かせる設定を試す。
      // もしこれで下を向くなら、モデル自体が最初から寝ている可能性がある。
      // modelEl.setAttribute('rotation', '90 0 0'); // 一般的な修正

      // 【修正ポイント3-B】もし前回の「下を向く」が「垂直に突き刺さる」意味だった場合：
      // 前回の「寝かせるX回転」は外して、JSのtick側で回転軸を制御するアプローチに変更。
      // ここではrotationを設定せず、rotatorElで制御する。

      // 入れ子にする: mover(位置) -> rotator(進行方向) -> model(glb)
      rotatorEl.appendChild(modelEl);
      moverEl.appendChild(rotatorEl);

      // 初期位置の設定（マーカー上のXY平面、Zはカメラ側にわずかに浮かせる）
      const x = (Math.random() - 0.5) * BOUNDS * 2;
      const y = (Math.random() - 0.5) * BOUNDS * 2;
      moverEl.setAttribute('position', `${x} ${y} 0.01`);

      // コンテナに追加
      fishContainer.appendChild(moverEl);

      // 速度タイプの決定
      const rand = Math.random();
      let speedConfig = rand < 0.4 ? SPEED_TYPES.SLOW : (rand < 0.8 ? SPEED_TYPES.NORMAL : SPEED_TYPES.FAST);

      const fishData = {
        mover: moverEl,
        rotator: rotatorEl, // 回転制御用に追加
        speed: speedConfig.speed,
        scoreValue: speedConfig.score,
        posX: x,
        posY: y,
        targetX: (Math.random() - 0.5) * BOUNDS * 2,
        targetY: (Math.random() - 0.5) * BOUNDS * 2
      };

      fishes.push(fishData);
    }

    // --- メインループ（移動と回転制御） ---
    function tick() {
      if (isGameOver || !targetEntity.object3D.visible) {
        requestAnimationFrame(tick);
        return;
      }

      fishes.forEach(fish => {
        // ベクトル計算（XY平面上）
        const dx = fish.targetX - fish.posX;
        const dy = fish.targetY - fish.posY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 0.02) {
          fish.targetX = (Math.random() - 0.5) * BOUNDS * 2;
          fish.targetY = (Math.random() - 0.5) * BOUNDS * 2;
        } else {
          // 移動
          fish.posX += (dx / dist) * fish.speed;
          fish.posY += (dy / dist) * fish.speed;

          // 【修正ポイント4】回転制御（XY平面での移動）
          // atan2(dx, dy) で、Y軸正の方向（上）を0度とした角度（ラジアン）を取得
          const angleRad = Math.atan2(dx, dy);
          const angleDeg = angleRad * (180 / Math.PI);

          // 位置の更新（親: mover）
          fish.mover.setAttribute('position', `${fish.posX} ${fish.posY} 0.01`);
          
          // 向きの更新（中間: rotator）
          // マーカー平面（XY）で動かすため、回転させるのは「Z軸」
          // (A-FrameのEuler角の順序依存だが、ここではZ軸回転のみ適用)
          fish.rotator.setAttribute('rotation', `0 0 ${-angleDeg}`);
          // モデル自体に rotation="90 0 0"（寝かせる）がかかっていると、
          // ここのZ回転が予期せぬ方向になるため、モデルのrotationは0 0 0にしておくのが無難。
        }
      });

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // --- タップ（掬う）処理 ---
    function handleScoop(event) {
      const intersection = event.detail.intersection;
      if (!intersection) return;

      // pond（a-plane）のローカル座標系でのタップ位置
      const tapX = intersection.point.x;
      const tapY = intersection.point.y;

      let caughtCountInThisTap = 0;

      // 範囲内の金魚を一括で掬う
      for (let i = fishes.length - 1; i >= 0; i--) {
        const fish = fishes[i];
        // XY平面上の距離
        const dist = Math.sqrt(Math.pow(fish.posX - tapX, 2) + Math.pow(fish.posY - tapY, 2));

        if (dist <= CATCH_RADIUS) {
          score += fish.scoreValue;
          caughtCount++;
          caughtCountInThisTap++;

          fish.mover.remove(); // 親エンティティごと削除
          fishes.splice(i, 1);
          spawnFish(); // 補充
        }
      }

      // 耐久度減少
      durability -= DURABILITY_DECREASE;
      if (durability <= 0) {
        durability = 0;
        updateUI();
        endGame();
        return;
      }

      updateUI();
    }

    function updateUI() {
      document.getElementById('count-val').innerText = caughtCount;
      document.getElementById('score-val').innerText = score;
      document.getElementById('durability-val').innerText = durability;
    }

    function endGame() {
      isGameOver = true;
      document.getElementById('final-count').innerText = caughtCount;
      document.getElementById('final-score').innerText = score;
      document.getElementById('game-over').style.display = 'flex';
    }

    function resetGame() {
      initGame();
    }
  </script>
</body>
</html>
