<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR金魚すくい</title>
  <!-- A-Frame & MindAR Libraries -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { 
      margin: 0; 
      overflow: hidden; 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    #ui-container { 
      position: absolute; 
      top: 10px; 
      left: 10px; 
      right: 10px; 
      display: flex; 
      justify-content: space-between; 
      z-index: 10; 
      color: #fff; 
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8); 
      font-size: 18px; 
      font-weight: bold; 
      pointer-events: none; 
    }
    .ui-box { background: rgba(0, 0, 0, 0.5); padding: 8px 12px; border-radius: 8px; }
    
    /* ゲームオーバー＆ランキング画面 */
    #game-over { 
      display: none; 
      position: absolute; 
      top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0, 0, 0, 0.85); 
      z-index: 20; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      color: white; 
      box-sizing: border-box;
      padding: 20px;
      overflow-y: auto;
    }
    #game-over h1 { font-size: 28px; margin-bottom: 5px; color: #ff4757; }
    #game-over p { font-size: 16px; margin: 3px 0; }

    /* 名前入力エリア */
    #form-container { margin: 15px 0; text-align: center; }
    #player-name { padding: 8px; font-size: 16px; border-radius: 5px; border: none; text-align: center; width: 180px; }
    #submit-btn { padding: 8px 16px; font-size: 16px; background: #ff9f43; border: none; color: white; border-radius: 5px; cursor: pointer; margin-left: 5px; }

    /* ランキング表示エリア */
    #ranking-result { display: none; width: 100%; max-width: 320px; margin-top: 10px; background: rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; }
    .rank-section { margin-bottom: 12px; }
    .rank-title { font-weight: bold; color: #fbc531; border-bottom: 1px solid #fbc531; padding-bottom: 3px; margin-bottom: 5px; font-size: 14px; text-align: left;}
    .rank-list { font-size: 13px; text-align: left; line-height: 1.5; }
    .my-rank { font-weight: bold; color: #4cd137; margin-top: 5px; font-size: 14px; }

    #restart-btn { 
      margin-top: 15px; 
      padding: 10px 20px; 
      font-size: 16px; 
      background: #2ed573; 
      border: none; 
      color: white; 
      border-radius: 25px; 
      cursor: pointer; 
      pointer-events: auto; 
    }
  </style>
</head>
<body>

  <!-- UI Overlay -->
  <div id="ui-container">
    <div class="ui-box">すくった数: <span id="count-val">0</span> 匹</div>
    <div class="ui-box">とくてん: <span id="score-val">0</span> pt</div>
  </div>

  <!-- Game Over & Ranking Screen -->
  <div id="game-over">
    <h1>ポイが破れました！</h1>
    <p>最終結果: <span id="final-count">0</span> 匹 / <span id="final-score">0</span> pt</p>
    
    <!-- 名前登録フォーム -->
    <div id="form-container">
      <input type="text" id="player-name" placeholder="ニックネームをいれてね" maxlength="8">
      <button id="submit-btn" onclick="submitScore()">とうろく</button>
    </div>

    <!-- ランキング結果表示 -->
    <div id="ranking-result">
      <div class="rank-section">
        <div class="rank-title">🏆 とくてん ランキング (TOP 3)</div>
        <div id="top-score-list" class="rank-list"></div>
        <div id="my-score-rank" class="my-rank"></div>
      </div>
      <div class="rank-section">
        <div class="rank-title">🐟 すくった数 ランキング (TOP 3)</div>
        <div id="top-count-list" class="rank-list"></div>
        <div id="my-count-rank" class="my-rank"></div>
      </div>
    </div>

    <button id="restart-btn" onclick="resetGame()">もう一度遊ぶ</button>
  </div>

  <!-- AR Scene -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="fishModelA" src="./goldfish_crucian_carp.glb"></a-asset-item>
      <a-asset-item id="fishModelB" src="./goldfish.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="example-target" mindar-image-target="targetIndex: 0">
      <a-plane id="pond" position="0 0 0" rotation="0 0 0" width="0.707" height="1.0" material="opacity: 0; transparent: true"></a-plane>
      <a-entity id="fish-container"></a-entity>
      <a-entity id="effect-container"></a-entity>
    </a-entity>

    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="1 2 1" intensity="0.8"></a-light>
  </a-scene>

  <script>
    // ★ここに取得したGoogle Apps Script (GAS)のWebアプリURLを貼り付けてください★
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzpxrfqTYib4fPKU4naGKDna9FmZr2gbL3HeusESJjnsn2njilt7qNggID_I4Jeul9D/exec";

    const MAX_FISH = 8;
    const CATCH_RADIUS = 0.12;
    const DURABILITY_DECREASE = 10;
    const BOUNDS_X = 0.28;
    const BOUNDS_Y = 0.40;

    let score = 0;
    let caughtCount = 0;
    let durability = 100;
    let isGameOver = false;
    let fishes = [];

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    const SPEED_TYPES = {
      SLOW:   { type: 'SLOW',   speed: 0.003, score: 100 },
      NORMAL: { type: 'NORMAL', speed: 0.007, score: 300 },
      FAST:   { type: 'FAST',   speed: 0.015, score: 600 }
    };

    const pond = document.getElementById('pond');
    const targetEntity = document.getElementById('example-target');
    const fishContainer = document.getElementById('fish-container');
    const effectContainer = document.getElementById('effect-container');

    window.addEventListener('load', () => {
      initGame();
      
      window.addEventListener('pointerdown', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
        if (isGameOver) return;

        if (!audioCtx) audioCtx = new AudioContext();
        if (!targetEntity.object3D.visible) return;

        handleScreenTap(e.clientX, e.clientY);
      });
    });

    function initGame() {
      score = 0;
      caughtCount = 0;
      durability = 100;
      isGameOver = false;

      updateUI();
      document.getElementById('game-over').style.display = 'none';
      document.getElementById('form-container').style.display = 'block';
      document.getElementById('ranking-result').style.display = 'none';
      document.getElementById('player-name').value = '';

      while (fishContainer.firstChild) {
        fishContainer.removeChild(fishContainer.firstChild);
      }
      fishes = [];

      for (let i = 0; i < MAX_FISH; i++) {
        spawnFish();
      }
    }

    function spawnFish() {
      if (fishes.length >= MAX_FISH) return;

      const fastCount = fishes.filter(f => f.type === 'FAST').length;
      let speedConfig;
      if (fastCount >= 1) {
        speedConfig = Math.random() < 0.5 ? SPEED_TYPES.SLOW : SPEED_TYPES.NORMAL;
      } else {
        const rand = Math.random();
        speedConfig = rand < 0.4 ? SPEED_TYPES.SLOW : (rand < 0.8 ? SPEED_TYPES.NORMAL : SPEED_TYPES.FAST);
      }

      const moverEl = document.createElement('a-entity');
      const rotatorEl = document.createElement('a-entity');
      const modelEl = document.createElement('a-entity');
      
      if (speedConfig.type === 'FAST') {
        modelEl.setAttribute('gltf-model', '#fishModelA');
        modelEl.setAttribute('scale', '0.1 0.1 0.1');
      } else {
        modelEl.setAttribute('gltf-model', '#fishModelB');
        modelEl.setAttribute('scale', '0.0005 0.0005 0.0005');
      }

      modelEl.setAttribute('rotation', '90 0 0');
      rotatorEl.appendChild(modelEl);
      moverEl.appendChild(rotatorEl);

      const x = (Math.random() - 0.5) * BOUNDS_X * 2;
      const y = (Math.random() - 0.5) * BOUNDS_Y * 2;
      moverEl.setAttribute('position', `${x} ${y} 0.01`);

      fishContainer.appendChild(moverEl);

      const fishData = {
        type: speedConfig.type,
        mover: moverEl,
        rotator: rotatorEl,
        speed: speedConfig.speed,
        scoreValue: speedConfig.score,
        posX: x,
        posY: y,
        targetX: (Math.random() - 0.5) * BOUNDS_X * 2,
        targetY: (Math.random() - 0.5) * BOUNDS_Y * 2
      };

      fishes.push(fishData);
    }

    function tick() {
      if (isGameOver || !targetEntity.object3D.visible) {
        requestAnimationFrame(tick);
        return;
      }

      fishes.forEach(fish => {
        const dx = fish.targetX - fish.posX;
        const dy = fish.targetY - fish.posY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 0.02) {
          fish.targetX = (Math.random() - 0.5) * BOUNDS_X * 2;
          fish.targetY = (Math.random() - 0.5) * BOUNDS_Y * 2;
        } else {
          fish.posX += (dx / dist) * fish.speed;
          fish.posY += (dy / dist) * fish.speed;

          const angleRad = Math.atan2(dx, dy);
          const angleDeg = angleRad * (180 / Math.PI);

          fish.mover.setAttribute('position', `${fish.posX} ${fish.posY} 0.01`);
          fish.rotator.setAttribute('rotation', `0 0 ${-angleDeg + 180}`);
        }
      });

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    function handleScreenTap(clientX, clientY) {
      const sceneEl = document.querySelector('a-scene');
      const camera = sceneEl.camera;
      if (!camera) return;

      const mouse = new THREE.Vector2(
        (clientX / window.innerWidth) * 2 - 1,
        -(clientY / window.innerHeight) * 2 + 1
      );

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObject(pond.object3D, true);

      if (intersects.length > 0) {
        const worldPoint = intersects[0].point;
        const localPoint = targetEntity.object3D.worldToLocal(worldPoint.clone());

        const tapX = localPoint.x;
        const tapY = localPoint.y;

        let totalGainedScore = 0;
        let caughtInThisTap = 0;

        createRippleEffect(tapX, tapY);

        for (let i = fishes.length - 1; i >= 0; i--) {
          const fish = fishes[i];
          const dist = Math.sqrt(Math.pow(fish.posX - tapX, 2) + Math.pow(fish.posY - tapY, 2));

          if (dist <= CATCH_RADIUS) {
            score += fish.scoreValue;
            totalGainedScore += fish.scoreValue;
            caughtCount++;
            caughtInThisTap++;

            fish.mover.remove();
            fishes.splice(i, 1);
            spawnFish();
          }
        }

        if (caughtInThisTap > 0) {
          playSplashSound();
          createScorePopup(tapX, tapY, `+${totalGainedScore}pt`);
        }
      }

      durability -= DURABILITY_DECREASE;
      if (durability <= 0) {
        durability = 0;
        updateUI();
        endGame();
        return;
      }

      updateUI();
    }

    // --- ランキングスコア送信機能 ---
    async function submitScore() {
      const nameInput = document.getElementById('player-name').value.trim();
      if (!nameInput) {
        alert('名前を入力してください');
        return;
      }

      if (GAS_API_URL === "YOUR_GAS_WEB_APP_URL_HERE") {
        alert('GASのURLが設定されていません。コード内の GAS_API_URL を書き換えてください。');
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = '送信中...';

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            name: nameInput,
            count: caughtCount,
            score: score
          })
        });

        const result = await response.json();

        if (result.status === 'success') {
          // 登録フォームを非表示にしてランキングを表示
          document.getElementById('form-container').style.display = 'none';
          document.getElementById('ranking-result').style.display = 'block';

          // 得点上位3名を表示
          const topScoreEl = document.getElementById('top-score-list');
          topScoreEl.innerHTML = result.topScore.map((r, i) => `${i + 1}位: ${r.name} (${r.val} pt)`).join('<br>');

          // 匹数上位3名を表示
          const topCountEl = document.getElementById('top-count-list');
          topCountEl.innerHTML = result.topCount.map((r, i) => `${i + 1}位: ${r.name} (${r.val} 匹)`).join('<br>');

          // 自分の順位を表示
          document.getElementById('my-score-rank').innerText = `あなたの順位: ${result.totalPlayers}人中 ${result.myRank.scoreRank}位`;
          document.getElementById('my-count-rank').innerText = `あなたの順位: ${result.totalPlayers}人中 ${result.myRank.countRank}位`;
        } else {
          alert('送信エラー: ' + result.message);
        }
      } catch (err) {
        alert('通信エラーが発生しました');
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '登録';
      }
    }

    // --- エフェクト処理 ---
    function playSplashSound() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.15);

      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function createRippleEffect(x, y) {
      const ring = document.createElement('a-ring');
      ring.setAttribute('position', `${x} ${y} 0.02`);
      ring.setAttribute('radius-inner', '0.01');
      ring.setAttribute('radius-outer', '0.03');
      ring.setAttribute('material', 'color: #718093; opacity: 0.8; transparent: true');

      ring.setAttribute('animation__scale', { property: 'scale', to: '3 3 3', dur: 500, easing: 'easeOutQuad' });
      ring.setAttribute('animation__fade', { property: 'material.opacity', to: '0', dur: 500, easing: 'easeOutQuad' });

      effectContainer.appendChild(ring);
      setTimeout(() => { ring.remove(); }, 500);
    }

    function createScorePopup(x, y, text) {
      const textEl = document.createElement('a-text');
      textEl.setAttribute('value', text);
      textEl.setAttribute('position', `${x} ${y} 0.1`);
      textEl.setAttribute('align', 'center');
      textEl.setAttribute('color', '#fbc531');
      textEl.setAttribute('scale', '0.4 0.4 0.4');

      textEl.setAttribute('animation__move', { property: 'position', to: `${x} ${y + 0.15} 0.2`, dur: 800, easing: 'easeOutCubic' });
      textEl.setAttribute('animation__fade', { property: 'material.opacity', to: '0', dur: 800, easing: 'easeInCubic' });

      effectContainer.appendChild(textEl);
      setTimeout(() => { textEl.remove(); }, 800);
    }

    function updateUI() {
      document.getElementById('count-val').innerText = caughtCount;
      document.getElementById('score-val').innerText = score;
    }

    function endGame() {
      isGameOver = true;
      document.getElementById('final-count').innerText = caughtCount;
      document.getElementById('final-score').innerText = score;
      document.getElementById('game-over').style.display = 'flex';
    }

    function resetGame() {
      initGame();
    }
  </script>
</body>
</html>
