<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR金魚すくい（向き補正版）</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      user-select: none;
    }
    #ui-container {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      font-size: 18px;
      font-weight: bold;
      pointer-events: none;
    }
    .ui-box {
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 12px;
      border-radius: 8px;
    }
    #game-over {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 20;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
    }
    #game-over h1 { font-size: 36px; margin-bottom: 10px; color: #ff4757; }
    #game-over p { font-size: 20px; margin: 5px 0; }
    #restart-btn {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 18px;
      background: #2ed573;
      border: none;
      color: white;
      border-radius: 25px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <div class="ui-box">掬った数: <span id="count-val">0</span> 匹</div>
    <div class="ui-box">得点: <span id="score-val">0</span> pt</div>
    <div class="ui-box">ポイ耐久度: <span id="durability-val">100</span>%</div>
  </div>

  <div id="game-over">
    <h1>ポイが破れました！</h1>
    <p>最終結果: <span id="final-count">0</span> 匹</p>
    <p>最終得点: <span id="final-score">0</span> pt</p>
    <button id="restart-btn" onclick="resetGame()">もう一度遊ぶ</button>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="fishModelA" src="./goldfish_crucian_carp.glb"></a-asset-item>
      <a-asset-item id="fishModelB" src="./goldfish.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .clickable" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <a-entity id="example-target" mindar-image-target="targetIndex: 0">
      <a-plane id="pond" class="clickable" position="0 0 0" rotation="0 0 0" width="2" height="2" material="opacity: 0; transparent: true"></a-plane>
    </a-entity>

    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="1 2 1" intensity="0.8"></a-light>
  </a-scene>

  <script>
    // --- ゲーム設定と状態 ---
    const MAX_FISH = 8;
    const CATCH_RADIUS = 0.35;
    const DURABILITY_DECREASE = 10;
    const BOUNDS = 0.8;

    let score = 0;
    let caughtCount = 0;
    let durability = 100;
    let isGameOver = false;
    let fishes = [];

    // モデルごとの設定（モデルの初期向きがズレている場合は rotationOffset を調整してください）
    const MODEL_CONFIGS = [
      {
        modelId: '#fishModelA',
        scale: '0.2 0.2 0.2',
        // モデルが進行方向に対して90度横を向いている場合は 90 や -90 に設定
        rotationOffset: 0 
      },
      {
        modelId: '#fishModelB',
        scale: '0.001 0.001 0.001',
        rotationOffset: 0
      }
    ];

    const SPEED_TYPES = {
      SLOW:   { speed: 0.003, score: 100 },
      NORMAL: { speed: 0.007, score: 300 },
      FAST:   { speed: 0.012, score: 500 }
    };

    const pond = document.getElementById('pond');
    const targetEntity = document.getElementById('example-target');

    window.addEventListener('load', () => {
      initGame();
      
      pond.addEventListener('click', (e) => {
        if (isGameOver) return;
        if (!targetEntity.object3D.visible) return;
        handleScoop(e);
      });
    });

    function initGame() {
      score = 0;
      caughtCount = 0;
      durability = 100;
      isGameOver = false;
      
      updateUI();
      document.getElementById('game-over').style.display = 'none';

      fishes.forEach(f => f.element.remove());
      fishes = [];

      for (let i = 0; i < MAX_FISH; i++) {
        spawnFish();
      }
    }

    function spawnFish() {
      if (fishes.length >= MAX_FISH) return;

      // 親ラップ（位置と進行方向のY軸回転を担当）
      const container = document.createElement('a-entity');
      // 子モデル（メッシュ自体を平面に伏せるためのX軸回転および個別スケール・オフセットを担当）
      const modelEl = document.createElement('a-entity');
      
      // ランダムにモデル設定を選択
      const config = MODEL_CONFIGS[Math.floor(Math.random() * MODEL_CONFIGS.length)];
      
      modelEl.setAttribute('gltf-model', config.modelId);
      modelEl.setAttribute('scale', config.scale);
      
      // モデルを寝かせる（X軸90度） + モデル固有の向き補正（Z軸/Y軸回転）
      modelEl.setAttribute('rotation', `90 ${config.rotationOffset} 0`);

      container.appendChild(modelEl);

      // 速度タイプ設定
      const rand = Math.random();
      let speedConfig = SPEED_TYPES.SLOW;
      if (rand >= 0.4 && rand < 0.8) speedConfig = SPEED_TYPES.NORMAL;
      else if (rand >= 0.8) speedConfig = SPEED_TYPES.FAST;

      const x = (Math.random() - 0.5) * BOUNDS * 2;
      const y = (Math.random() - 0.5) * BOUNDS * 2;
      container.setAttribute('position', `${x}${y} 0.01`);

      targetEntity.appendChild(container);

      const fishData = {
        element: container,
        speed: speedConfig.speed,
        scoreValue: speedConfig.score,
        posX: x,
        posY: y,
        targetX: (Math.random() - 0.5) * BOUNDS * 2,
        targetY: (Math.random() - 0.5) * BOUNDS * 2
      };

      fishes.push(fishData);
    }

    function tick() {
      if (isGameOver) return;
      if (!targetEntity.object3D.visible) {
        requestAnimationFrame(tick);
        return;
      }

      fishes.forEach(fish => {
        const dx = fish.targetX - fish.posX;
        const dy = fish.targetY - fish.posY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 0.05) {
          fish.targetX = (Math.random() - 0.5) * BOUNDS * 2;
          fish.targetY = (Math.random() - 0.5) * BOUNDS * 2;
        } else {
          // 移動処理
          fish.posX += (dx / dist) * fish.speed;
          fish.posY += (dy / dist) * fish.speed;

          // 移動方向の角度を計算（Math.atan2(dy, dx) で角度を取得）
          const angleRad = Math.atan2(dy, dx);
          // A-Frameの座標系に合わせて度数法変換 (標準では右向きが0度)
          const angleDeg = angleRad * (180 / Math.PI) - 90;

          // 親コンテナの位置とY軸回転を更新
          fish.element.setAttribute('position', `${fish.posX
